<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Milestone: an interactive HAM highway bid model (demo data)." />
    <title>Milestone</title>
    <!-- Apply the saved or system theme before first paint (mirrors src/app/theme.ts). -->
    <script>
      try {
        var m = document.cookie.match(/(?:^|; )milestone\.theme\.0=(light|dark)(?:;|$)/)
        var t = m ? m[1] : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', t === 'dark')
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
